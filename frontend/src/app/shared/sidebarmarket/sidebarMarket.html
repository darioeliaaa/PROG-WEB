<aside class="sidenav">

  <a routerLink="/market" class="brand" aria-label="MoneyMind Market, vai alla home del market">
    <span class="brand-mark"><mm-rosette preset="mark" tone="iris" /></span>
    <span class="brand-text">
      <strong>MoneyMind</strong>
      <span class="brand-sub">Market</span>
    </span>
  </a>

  <nav class="side-nav" aria-label="Investimenti">
    <span class="side-label">Mercati</span>

    <a class="nav-item parent-item"
       routerLink="/market"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{exact: true}"
       (click)="toggleMarket()">
      <mm-icon name="home" />
      <span class="link-text">Home Market</span>
      <span class="arrow-icon" [class.rotated]="isMarketOpen"><mm-icon name="chevron-down" /></span>
    </a>

    <div class="sub-menu" *ngIf="isMarketOpen">
      <a routerLink="/market/azioni" routerLinkActive="active" class="nav-item sub-item">
        <mm-icon name="chart" class="sub-icon" />
        <span class="link-text">Azioni</span>
      </a>
      <a routerLink="/market/etf" routerLinkActive="active" class="nav-item sub-item">
        <mm-icon name="globe" class="sub-icon" />
        <span class="link-text">ETF</span>
      </a>
      <a routerLink="/market/crypto" routerLinkActive="active" class="nav-item sub-item">
        <mm-icon name="coins" class="sub-icon" />
        <span class="link-text">Cripto</span>
      </a>
    </div>

    <span class="side-label">Il tuo capitale</span>

    <a routerLink="/portfolio" routerLinkActive="active" class="nav-item">
      <mm-icon name="briefcase" />
      <span class="link-text">Portafoglio</span>
    </a>
  </nav>

  <div class="side-foot">
    <div class="side-seal" aria-hidden="true">
      <mm-guilloche tone="iris" [count]="16" [seed]="4" />
      <mm-microtext text="MONEYMIND MARKET · SERIE MM" />
    </div>
  </div>

</aside>
