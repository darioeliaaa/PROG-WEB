<div class="movimenti-container modal-body">

  <div class="done-flash" *ngIf="successMessage">
    <span class="tick"><mm-icon name="check" /></span>
    <span>{{ successMessage }}</span>
  </div>

  <form (ngSubmit)="salva()" class="mov-form">

    <div class="seg mov-seg" role="group" aria-label="Tipo di movimento">
      <button type="button"
              [class.active]="nuovoMovimento.tipo === 'entrata'"
              (click)="nuovoMovimento.tipo = 'entrata'"
              class="up">
        <mm-icon name="arrow-down" /> Entrata
      </button>
      <button type="button"
              [class.active]="nuovoMovimento.tipo === 'uscita'"
              (click)="nuovoMovimento.tipo = 'uscita'"
              class="down">
        <mm-icon name="arrow-up" /> Uscita
      </button>
    </div>

    <div class="amount" [class.up]="nuovoMovimento.tipo === 'entrata'" [class.down]="nuovoMovimento.tipo === 'uscita'">
      <input type="number"
             [(ngModel)]="nuovoMovimento.importo"
             name="importo"
             inputmode="decimal"
             step="0.01"
             placeholder="0,00"
             aria-label="Importo"
             required>
      <span class="cur">€</span>
    </div>

    <div class="field">
      <label for="mov-desc">Descrizione</label>
      <input id="mov-desc" type="text"
             [(ngModel)]="nuovoMovimento.descrizione"
             name="descrizione"
             class="input"
             placeholder="Es. Spesa settimanale"
             required>
    </div>

    <div class="field">
      <span class="field-label">Categoria</span>
      <div class="cat-picks" role="radiogroup" aria-label="Categoria">
        <label class="cat-pick" *ngFor="let c of categorie">
          <input type="radio" name="categoria" [value]="c" [(ngModel)]="nuovoMovimento.categoria">
          <mm-cat-icon [category]="c" />
          <span>{{ nomeCategoria(c) }}</span>
        </label>
      </div>
    </div>

    <div class="field" *ngIf="!walletId">
      <label for="mov-data">Data</label>
      <input id="mov-data" type="date" [(ngModel)]="nuovoMovimento.data" name="data" class="input">
    </div>

    <div class="note err" *ngIf="errorMessage">
      <mm-icon name="close" /> {{ errorMessage }}
    </div>

    <div class="modal-foot">
      <button type="button" (click)="annulla()" class="btn btn-ghost btn-lg">Annulla</button>
      <button type="submit" class="btn btn-primary btn-lg" [disabled]="isLoading">
        {{ isLoading ? 'Salvataggio…' : 'Salva movimento' }}
      </button>
    </div>

  </form>
</div>
