<div class="settings-container">
  <div class="settings-card">
    <header class="settings-header">
      <h1>Impostazioni di Sistema</h1>
      <p>Gestisci le preferenze del tuo account</p>
    </header>

    <div class="settings-content">
      <section class="settings-group">
        <h3>Preferenze Generali</h3>
        <div class="setting-row">
          <div class="info">
            <label>Lingua</label>
            <span>Scegli la lingua dell'interfaccia</span>
          </div>
          <select [(ngModel)]="systemSettings.language">
            <option value="it">Italiano</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="setting-row">
          <div class="info">
            <label>Valuta</label>
            <span>Valuta principale per i conteggi</span>
          </div>
          <select [(ngModel)]="systemSettings.currency">
            <option value="EUR">Euro (€)</option>
            <option value="USD">Dollar ($)</option>
          </select>
        </div>
      </section>

      <section class="settings-group">
        <h3>Sicurezza & Avvisi</h3>
        <div class="setting-row">
          <div class="info">
            <label>Modalità Privacy</label>
            <span>Nascondi i saldi nella dashboard</span>
          </div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="systemSettings.privacyMode">
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="info">
            <label>Avvisi Budget</label>
            <span>Notifica al superamento del limite</span>
          </div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="systemSettings.budgetAlerts">
            <span class="slider"></span>
          </label>
        </div>
      </section>
    </div>

    <footer class="settings-footer">
      <button class="btn-save" (click)="saveSettings()">Salva Impostazioni</button>
    </footer>
  </div>
</div>
