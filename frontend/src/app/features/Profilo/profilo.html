<div class="light-container">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div *ngIf="isLoadingData" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div class="layout-grid">

    <aside class="hero-side">
      <button class="back-link" (click)="backToDashboard()">
        <span class="icon">←</span> Torna alla Dashboard
      </button>

      <div class="hero-content">
        <div class="avatar-container">
          {{ getInitials() }}
        </div>
        <h1>Ciao, <span class="gradient-text">{{ userData.nome }}</span>.</h1>
        <p class="subtitle">Gestisci la tua identità finanziaria.<br>Tutto in un unico posto.</p>

        <div class="status-badge" [ngClass]="isError ? 'error' : 'success'" *ngIf="message">
          <span class="dot"></span> {{ message }}
        </div>
      </div>
    </aside>

    <main class="form-side">
      <form (ngSubmit)="onSubmit()" class="clean-form">

        <div class="row-2">
          <div class="input-wrap">
            <label>Nome</label>
            <input type="text" name="nome" [(ngModel)]="userData.nome" [disabled]="isSaving">
          </div>
          <div class="input-wrap">
            <label>Cognome</label>
            <input type="text" name="cognome" [(ngModel)]="userData.cognome" [disabled]="isSaving">
          </div>
        </div>

        <div class="input-wrap">
          <label>Genere</label>
          <div class="select-wrapper">
            <select name="sesso" [(ngModel)]="userData.sesso" [disabled]="isSaving">
              <option value="" disabled>Seleziona</option>
              <option value="M">Uomo</option>
              <option value="F">Donna</option>
              <option value="Altro">Altro</option>
            </select>
          </div>
        </div>

        <div class="row-2">
          <div class="input-wrap">
            <label>Data di Nascita</label>
            <input type="date" name="dataDiNascita" [(ngModel)]="userData.dataDiNascita" [disabled]="isSaving">
          </div>
          <div class="input-wrap">
            <label>Telefono</label>
            <input type="tel" name="telefono" [(ngModel)]="userData.telefono" [disabled]="isSaving">
          </div>
        </div>

        <div class="input-wrap">
          <label>Indirizzo di Residenza</label>
          <input type="text" name="indirizzo" [(ngModel)]="userData.indirizzo" [disabled]="isSaving" placeholder="Via Roma 1, Milano">
        </div>

        <div class="footer-actions">
          <button type="button" class="btn-cancel" (click)="backToDashboard()">Annulla</button>
          <button type="submit" class="btn-primary" [disabled]="isSaving">
            <span *ngIf="!isSaving">Salva Modifiche</span>
            <span *ngIf="isSaving" class="loader"></span>
          </button>
        </div>

      </form>
    </main>

  </div>
</div>
