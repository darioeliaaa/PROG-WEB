<router-outlet *ngIf="isLoginPage"></router-outlet>

<div *ngIf="!isLoginPage" style="display: flex; height: 100vh; overflow: hidden;">

  <app-sidebar-market *ngIf="isMarketSection"></app-sidebar-market>
  <app-sidebar *ngIf="!isMarketSection"></app-sidebar>

  <div class="main-content"
       style="flex-grow: 1;
              display: flex;
              flex-direction: column;
              min-width: 0; /* FONDAMENTALE per il fix della dashboard che si stringe */
              background-color: #f8fafc;">

    <div style="height: 100%; overflow-y: auto; display: flex; flex-direction: column;">

      <app-header></app-header>

      <div style="padding: 20px; flex-grow: 1;">
        <router-outlet></router-outlet>
      </div>

    </div>

  </div>

</div>
