<div class="dashboard-container">

  <header class="page-header">
    <div class="header-left">
      <div class="avatar-circle">
        <span class="icon-settings">⚙️</span>
      </div>
      <div class="header-texts">
        <h1>Impostazioni di Sistema</h1>
        <p>Gestisci le preferenze del tuo account</p>
      </div>
    </div>
    <button class="back-btn" (click)="backToDashboard()">Torna alla Dashboard</button>
  </header>

  <div class="form-section bg-white-card">
    <div class="form-grid">

      <div class="full-width-title">
        <h3>Preferenze Generali</h3>
      </div>

      <div class="form-group">
        <label for="currency">Valuta</label>
        <select id="currency" [(ngModel)]="systemSettings.currency">
          <option value="EUR">Euro (€)</option>
          <option value="USD">Dollar ($)</option>
        </select>
        <span class="field-info">Valuta principale per i conteggi</span>
      </div>

      <div class="form-group mobile-hide"></div>

      <div class="full-width-title">
        <h3>Sicurezza & Avvisi</h3>
      </div>

      <div class="form-group">
        <div class="toggle-container">
          <div class="info">
            <label>Modalità Privacy</label>
            <span>Nascondi i saldi nella dashboard</span>
          </div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="systemSettings.privacyMode">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <div class="toggle-container">
          <div class="info">
            <label>Avvisi Budget</label>
            <span>Notifica al superamento del limite</span>
          </div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="systemSettings.budgetAlerts">
            <span class="slider"></span>
          </label>
        </div>
      </div>

    </div>

    <div class="form-actions">
      <button class="btn-cancel" (click)="backToDashboard()">Annulla</button>
      <button class="btn-save" (click)="saveSettings()">
        Salva Impostazioni
      </button>
    </div>
  </div>
</div>
