<!DOCTYPE html>
<html>
<head>
  <title>Slide Navbar</title>
  <link rel="stylesheet" type="text/css" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<a (click)="tornaIndietro()" style="position: absolute; top: 30px; left: 30px; z-index: 1000; cursor: pointer; font-weight: bold; color: #7D7DFAFF;">
  &#8592; Torna alla Dashboard
</a>

<div class="main">
  <input type="checkbox" id="chk" aria-hidden="true">

  <div class="signup">
    <form (ngSubmit)="onRegister()">
      <label for="chk" aria-hidden="true">Sign up</label>

      <input type="text" name="username" [(ngModel)]="registerObj.username" placeholder="User name" required>
      <input type="email" name="email" [(ngModel)]="registerObj.email" placeholder="Email" required>
      <input type="password" name="pswd" [(ngModel)]="registerObj.password" placeholder="Password" required>

      <div *ngIf="registerMessage"
           class="register-label">
        {{ registerMessage }}
      </div>

      <button type="submit">Sign up</button>
    </form>
  </div>

  <div class="login">
    <form (ngSubmit)="onLogin()">
      <label for="chk" aria-hidden="true">Login</label>

      <input type="email" name="loginEmail" [(ngModel)]="loginObj.email" placeholder="Email" required>
      <input type="password" name="loginPass" [(ngModel)]="loginObj.password" placeholder="Password" required>


      <div *ngIf="errorMessage" class="error-label">
        {{ errorMessage }}
      </div>

      <button type="submit">Login</button>
    </form>
  </div>
</div>
</body>
</html>
