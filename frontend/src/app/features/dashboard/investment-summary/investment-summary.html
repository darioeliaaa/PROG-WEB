<div class="glass-card summary-card">

  <div class="info-group">
    <h3>Saldo Totale</h3>

    <div class="balance-amount" [class.negative-balance]="saldoAttuale < 0">
      {{ saldoAttuale | currency:'EUR':'symbol':'1.2-2' }}
    </div>

    <div class="stats-row" style="margin-top: 15px; display: flex; gap: 15px;">
      <span class="performance-badge positive">
        <i class="fa fa-arrow-up"></i>
        {{ totaleEntrate | currency:'EUR':'symbol':'1.0-0' }}
        <small> Tot. Entrate</small>
      </span>

      <span class="performance-badge negative">
        <i class="fa fa-arrow-down"></i>
        {{ totaleUscite | currency:'EUR':'symbol':'1.0-0' }}
        <small> Tot. Uscite</small>
      </span>
    </div>
  </div>

  <div class="mini-chart">
    <div *ngFor="let item of trendData"
         class="bar-wrapper"
         [title]="item.label + ': ' + (item.value | currency:'EUR')">

      <div class="bar"
           [style.background-color]="item.value >= 0 ? '#6366f1' : '#ef4444'"
           [class.active]="item.isCurrent"
           [style.height.%]="item.heightPercent">
      </div>

      <div class="bar-label" style="font-size: 0.6rem; color: #94a3b8; margin-top: 4px; text-align: center;">
        {{ item.label }}
      </div>

    </div>
  </div>

</div>
