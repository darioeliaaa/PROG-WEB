<div class="chart-page-container">

  <div class="header-actions">
    <div class="title-group">
      <h2>{{ pulisciSimbolo(symbol) }}</h2>
      <span class="asset-subtitle">Analisi Tecnica</span>
    </div>

    <button class="btn-trade-action" (click)="openTradePanel()">
      Trade
    </button>

    <button class="back-btn" (click)="goBack()">
      <i class="back-arrow"></i> Torna al Market
    </button>
  </div>

  <div class="tv-wrapper">
    <div id="tradingview_chart" #containerDiv class="tradingview_widget"></div>
  </div>

</div>

<div class="modal-overlay" *ngIf="isTradeModalOpen">
  <div class="trade-card-stylish">

    <div class="stylish-header">
      <div class="header-left">
        <div class="asset-pill">
          <img [src]="selectedAsset?.logoUrl || 'assets/icons/default-asset.png'"
               class="mini-logo"
               (error)="handleImgError($event, symbol)">
          <span>{{ pulisciSimbolo(symbol) }}</span>
        </div>
        <h3>Nuovo Ordine</h3>
      </div>

      <div class="holding-badge">
        Possedute: <strong>{{ getMyQuantity(symbol) | number:'1.0-4' }}</strong>
      </div>
    </div>

    <div class="form-group">
      <div class="toggle-buttons">
        <button type="button" [class.active]="tradeAction === 'BUY'" (click)="setAction('BUY')" class="btn-toggle income"> <span>▲</span> Acquista </button>
        <button type="button" [class.active]="tradeAction === 'SELL'" (click)="setAction('SELL')" class="btn-toggle expense"> <span>▼</span> Vendi </button>
      </div>
    </div>

    <div class="center-input-section">
      <label>QUANTITÀ (AZIONI)</label>
      <div class="amount-wrapper">
        <input type="number"
               [(ngModel)]="tradeQuantity"
               (input)="onQuantityChange()"
               class="big-input"
               [ngClass]="{'text-green': tradeAction === 'BUY', 'text-red': tradeAction === 'SELL'}"
               placeholder="0" min="0">
      </div>
    </div>

    <div class="center-input-section" style="margin-top: 15px;">
      <label>IMPORTO (€)</label>
      <div class="amount-wrapper small-wrapper">
        <input type="number"
               [(ngModel)]="tradeAmount"
               (input)="onAmountChange()"
               class="big-input small-input"
               placeholder="0.00">
        <span class="currency-suffix">€</span>
      </div>
    </div>

    <div class="info-row">
      <span>Prezzo Attuale:</span>
      <strong>{{ selectedAsset?.currentPrice | currency:'USD' }}</strong>
    </div>

    <div class="form-actions">
      <button type="button" (click)="closeTradePanel()" class="btn-secondary">Annulla</button>
      <button type="button" class="btn-primary" (click)="confirmTrade()" [disabled]="isProcessing || !tradeQuantity || tradeQuantity <= 0">
        <span *ngIf="!isProcessing">Conferma {{ tradeAction === 'BUY' ? 'Acquisto' : 'Vendita' }}</span>
        <span *ngIf="isProcessing">Esecuzione...</span>
      </button>
    </div>

  </div>
</div>

<div class="modal-overlay" *ngIf="showLoginModal">
  <div class="login-prompt-card stylish-lock-card">
    <button class="close-icon-btn" (click)="closeLoginModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="lock-icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
    </div>
    <h3>Area Riservata</h3>
    <p>Autenticati per effettuare operazioni di trading su questo asset.</p>
    <button class="btn-auth-lock" routerLink="/login">Accedi ora</button>
  </div>
</div>
