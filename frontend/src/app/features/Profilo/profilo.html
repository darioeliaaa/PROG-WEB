<div class="dashboard-container">

  <div *ngIf="isLoadingData" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <header class="page-header">
    <div class="header-left">
      <div class="avatar-circle">
        {{ getInitials() }}
      </div>
      <div class="header-texts">
        <h1>Il tuo Profilo</h1>
        <p>Gestisci le tue informazioni personali</p>
      </div>
    </div>
    <button class="back-btn" (click)="backToDashboard()">Torna alla Dashboard</button>
  </header>

  <div *ngIf="message" class="feedback-box" [ngClass]="isError ? 'error' : 'success'">
    <span class="icon">{{ isError ? '⚠️' : '✅' }}</span>
    <span>{{ message }}</span>
  </div>

  <div class="form-section bg-white-card">
    <form (ngSubmit)="onSubmit()">
      <div class="form-grid">

        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome"
                 [(ngModel)]="userData.nome"
                 placeholder="Il tuo nome"
                 [disabled]="isSaving">
        </div>

        <div class="form-group">
          <label for="cognome">Cognome</label>
          <input type="text" id="cognome" name="cognome"
                 [(ngModel)]="userData.cognome"
                 placeholder="Il tuo cognome"
                 [disabled]="isSaving">
        </div>

        <div class="form-group">
          <label for="sesso">Genere</label>
          <div class="select-wrapper">
            <select id="sesso" name="sesso" [(ngModel)]="userData.sesso" [disabled]="isSaving">
              <option value="" disabled>Seleziona genere</option>
              <option value="M">Uomo</option>
              <option value="F">Donna</option>
              <option value="Altro">Altro</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="dataNascita">Data di Nascita</label>
          <input type="date" id="dataNascita" name="dataDiNascita"
                 [(ngModel)]="userData.dataDiNascita"
                 [disabled]="isSaving">
        </div>

        <div class="form-group">
          <label for="telefono">Telefono</label>
          <input type="tel" id="telefono" name="telefono"
                 [(ngModel)]="userData.telefono"
                 placeholder="+39 333 1234567"
                 [disabled]="isSaving">
        </div>

        <div class="form-group mobile-hide"></div>

        <div class="form-group full-width">
          <label for="indirizzo">Indirizzo di Residenza</label>
          <input type="text" id="indirizzo" name="indirizzo"
                 [(ngModel)]="userData.indirizzo"
                 placeholder="Via Roma 10, Milano"
                 [disabled]="isSaving">
        </div>

      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="backToDashboard()" [disabled]="isSaving">
          Annulla
        </button>

        <button type="submit" class="btn-save" [disabled]="isSaving">
          <span *ngIf="!isSaving">Salva Modifiche</span>
          <span *ngIf="isSaving" class="saving-text">
            <span class="mini-spinner"></span> Salvataggio...
          </span>
        </button>
      </div>
    </form>
  </div>

</div>
