<div class="settings-wrapper">
  <aside class="settings-sidebar">
    <h2>Impostazioni</h2>
    <nav>
      <button [class.active]="activeTab === 'profilo'" (click)="setTab('profilo')">Profilo</button>
      <button [class.active]="activeTab === 'wallets'" (click)="setTab('wallets')">Portafogli</button>
    </nav>
  </aside>

  <main class="settings-content">
    <section *ngIf="activeTab === 'profilo'">
      <app-profilo></app-profilo>
    </section>

    <section *ngIf="activeTab === 'wallets'">

      <div class="header-section" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3>I tuoi Portafogli</h3>
        <button class="btn-add-wallet" *ngIf="!selectedWallet && !showCreateForm" (click)="showCreateForm = true">
          + Nuovo Portafoglio
        </button>
      </div>

      <div class="manage-panel" *ngIf="showCreateForm">
        <h4>Crea nuovo Portafoglio</h4>
        <div class="form-group">
          <label>Nome</label>
          <input type="text" [(ngModel)]="newWallet.name" placeholder="Es. Spese Casa">
        </div>
        <div class="form-group">
          <label>Budget Mensile (€)</label>
          <input type="number" [(ngModel)]="newWallet.monthlyBudget">
        </div>
        <div class="form-actions" style="display: flex; gap: 10px; margin-top: 20px;">
          <button (click)="showCreateForm = false" class="btn-back" style="margin-bottom: 0;">Annulla</button>
          <button (click)="createNewWallet()" class="btn-save" style="background-color: #4f46e5;">Crea</button>
        </div>
      </div>

      <div class="wallet-list" *ngIf="!selectedWallet && !showCreateForm">
        <div *ngFor="let w of userWallets" class="wallet-card">
          <span>{{ w.name }}</span>
          <button *ngIf="!w.personal" (click)="openManage(w)">Gestisci</button>
          <span *ngIf="w.personal" class="badge">Personale</span>
        </div>
      </div>

      <div class="manage-panel" *ngIf="selectedWallet && !showCreateForm">
        <button (click)="selectedWallet = null" class="btn-back">← Torna alla lista</button>
        <h4>Modifica {{ selectedWallet.name }}</h4>

        <div class="form-group">
          <label>Nome Portafoglio</label>
          <input type="text" [(ngModel)]="selectedWallet.name">
        </div>

        <div class="form-group">
          <label>Budget Mensile (€)</label>
          <input type="number" [(ngModel)]="selectedWallet.monthlyBudget">
        </div>

        <div class="members-section">
          <h5>Membri del gruppo</h5>
          <ul class="member-list">
            <li *ngFor="let m of members">
              {{ m.username }}
              <button *ngIf="m.id !== userId" class="btn-remove" (click)="removeUser(m.id)">Rimuovi</button>
              <span *ngIf="m.id === userId" class="badge-admin">Tu (Admin)</span>
            </li>
          </ul>
        </div>

        <button (click)="saveWalletSettings()" class="btn-save">Salva Modifiche</button>
      </div>

    </section>
  </main>
</div>
