<div class="glass-card summary-card">

  <div class="info-group">
    <h3>Patrimonio Totale</h3>

    <div class="balance-amount">
      {{ totalBalance | currency:'EUR':'symbol':'1.0-0' }}
    </div>

    <span class="performance-badge"
          [ngClass]="{'positive': monthlyInvested > 0, 'negative': monthlyInvested === 0}">

      {{ monthlyInvested > 0 ? '+' : '' }}{{ monthlyInvested | currency:'EUR':'symbol':'1.0-0' }}
      <small> questo mese</small>
    </span>
  </div>

  <div class="mini-chart">
    <div class="bar" style="height: 40%"></div>
    <div class="bar" style="height: 60%"></div>
    <div class="bar" style="height: 50%"></div>
    <div class="bar" style="height: 80%"></div>
    <div class="bar" style="height: 65%"></div>
    <div class="bar active" style="height: 90%"></div>
  </div>

</div>
