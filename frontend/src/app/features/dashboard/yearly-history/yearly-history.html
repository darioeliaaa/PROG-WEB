<section class="card yearly-card">
  <div class="card-head">
    <div>
      <h3>Andamento annuale</h3>
      <p class="sub">Entrate e uscite mese per mese, {{ currentDate | date:'yyyy' }}</p>
    </div>
  </div>

  <div class="chart-container">
    <canvas baseChart
            [data]="barChartData"
            [options]="barChartOptions"
            [type]="barChartType">
    </canvas>
  </div>
</section>
