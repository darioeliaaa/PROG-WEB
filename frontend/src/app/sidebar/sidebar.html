<aside class="sidenav">

  <a routerLink="/dashboard" class="brand" aria-label="MoneyMind, vai alla dashboard">
    <span class="brand-mark"><mm-rosette preset="mark" tone="iris" /></span>
    <span class="brand-text">
      <strong>MoneyMind</strong>
      <span class="brand-sub">Gestione finanze</span>
    </span>
  </a>

  <nav class="side-nav" aria-label="Gestione finanze">
    <span class="side-label">Il tuo denaro</span>

    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <mm-icon name="grid" />
      <span class="link-text">Dashboard</span>
    </a>

    <a routerLink="/wallet" routerLinkActive="active" class="nav-item">
      <mm-icon name="wallet" />
      <span class="link-text">Wallet</span>
    </a>
  </nav>

  <div class="side-foot">
    <a routerLink="/chi-siamo" routerLinkActive="active" class="nav-item">
      <mm-icon name="users" />
      <span class="link-text">Chi siamo</span>
    </a>

    <div class="side-seal" aria-hidden="true">
      <mm-guilloche tone="iris" [count]="16" [seed]="2" />
      <mm-microtext text="MONEYMIND · SERIE MM" />
    </div>
  </div>

</aside>
