  <app-sidebar-market *ngIf="isMarketSection"></app-sidebar-market>

  <div class="main-content" style="flex-grow: 1; display: flex; flex-direction: column;min-width: 0; background-color: #f8fafc;">

      <router-outlet></router-outlet>
    </div>

  </div>

</div>
