<header class="top-bar">
  <div class="spacer"></div>

  <nav class="toggle-pill">

    <a routerLink="/dashboard"
       [class.active]="router.url.includes('/dashboard') || router.url.includes('/movimenti')"
       class="toggle-btn">
      Gestione Finanze
    </a>

    <a routerLink="/market"
       [class.active]="router.url.includes('/market')"
       class="toggle-btn">
      Investimenti
    </a>

  </nav>

  <div class="user-profile">
    <a routerLink="/login" class="avatar-circle">
      <img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" alt="Login" width="24">
    </a>
  </div>
</header>
