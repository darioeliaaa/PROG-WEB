<div class="dashboard-container">

  <header class="dashboard-header">
    <div class="header-text">
      <h1>Dashboard Finanziaria</h1>
      <p class="subtitle">Benvenuto nella tua panoramica economica</p>
    </div>

    <div class="header-controls">
      <div class="month-selector">
        <button class="nav-arrow" (click)="cambiaMese(-1)">
          <span class="arrow-icon">❮</span>
        </button>
        <span class="date-badge">{{ titoloMese | titlecase }}</span>
        <button class="nav-arrow" (click)="cambiaMese(1)">
          <span class="arrow-icon">❯</span>
        </button>
      </div>
    </div>
  </header>

  <div class="gamification-wrapper" *ngIf="profilePercentage < 100">
    <div class="gamification-card" (click)="goToProfile()">

      <div class="card-left">
        <div class="icon-box">
          🚀
        </div>
        <div class="text-box">
          <div class="title-row">
            <h3>Completa il tuo profilo</h3>
            <span class="percentage-badge">{{ profilePercentage }}%</span>
          </div>
          <p>Aumenta la sicurezza del tuo account.</p>
        </div>
      </div>

      <div class="card-right">
        <div class="progress-container">
          <div class="progress-track">
            <div class="progress-fill" [style.width.%]="profilePercentage"></div>
          </div>
        </div>
        <div class="action-arrow">➜</div>
      </div>

    </div>
  </div>

  <section class="chart-section fade-in">
    <app-investment-summary
      [currentDate]="currentDate"
      [tutteLeTransazioni]="transazioniTotali">
    </app-investment-summary>
  </section>

  <section class="chart-section fade-in" style="animation-delay: 0.1s;">
    <app-budget-overview
      [currentDate]="currentDate"
      [datiReali]="datiMensili">
    </app-budget-overview>
  </section>

  <section class="chart-section fade-in" style="animation-delay: 0.2s;">
    <app-yearly-history
      [currentDate]="currentDate"
      [allTransactions]="transazioniTotali">
    </app-yearly-history>
  </section>

</div>
