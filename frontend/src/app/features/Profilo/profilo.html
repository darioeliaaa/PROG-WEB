<div class="dashboard-container">

  <div class="profile-card">

    <div class="header-content">
      <button class="back-btn" (click)="backToDashboard()">❮ Torna alla Dashboard</button>
      <h1>Profilo Personale</h1>
      <p>Completa al 100% il tuo profilo per sbloccare tutte le funzioni.</p>
    </div>

    <div *ngIf="message" [ngClass]="{'success-msg': !isError, 'error-msg': isError}">
      {{ message }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-grid">

        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome"
                 [(ngModel)]="userData.nome"
                 placeholder="Mario" required>
        </div>

        <div class="form-group">
          <label for="cognome">Cognome</label>
          <input type="text" id="cognome" name="cognome"
                 [(ngModel)]="userData.cognome"
                 placeholder="Rossi" required>
        </div>

        <div class="form-group">
          <label for="sesso">Sesso</label>
          <select id="sesso" name="sesso" [(ngModel)]="userData.sesso" required>
            <option value="" disabled selected>Seleziona...</option>
            <option value="M">Maschio</option>
            <option value="F">Femmina</option>
            <option value="Altro">Altro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="dataNascita">Data di Nascita</label>
          <input type="date" id="dataNascita" name="dataDiNascita"
                 [(ngModel)]="userData.dataDiNascita" required>
        </div>

        <div class="form-group">
          <label for="telefono">Numero di Telefono</label>
          <input type="tel" id="telefono" name="telefono"
                 [(ngModel)]="userData.telefono"
                 placeholder="+39 333 ..." required>
        </div>

        <div class="form-group full-width">
          <label for="indirizzo">Indirizzo</label>
          <input type="text" id="indirizzo" name="indirizzo"
                 [(ngModel)]="userData.indirizzo"
                 placeholder="Via Roma 10, Milano">
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Salva e Continua</button>
      </div>
    </form>

  </div>

</div>
